[workspace]
members = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# Slim debug info: full MSVC debuginfo across ~20 test binaries and feature builds grew target/ to 96 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false

# Shipped installer binary; no panic = "abort" (actor threads rely on unwinding).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

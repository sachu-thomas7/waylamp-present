[package]
name = "waylamp-present"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"
authors = ["Waylamp Present contributors"]
description = "Presentation control: import PPTX/PDF, projector output, notes and timer"

# The lib target must explicitly point to lib.rs
[lib]
name = "waylamp_present_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "waylamp-present"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["full"] }
thiserror          = "2"
ts-rs              = { version = "12", features = ["serde-compat"] }
anyhow             = "1"
toml               = "0.8"
notify             = "8"
zip             = { version = "9", default-features = false, features = ["deflate"] }
quick-xml       = { version = "0.42", features = ["serialize"] }
pdfium-render   = { version = "0.8", features = ["sync"] }
uuid            = { version = "1", features = ["v4"] }
# pdfium-render enables image without a PNG encoder; PDF page backgrounds are saved as PNG.
image           = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2"

[features]
default          = ["custom-protocol"]
custom-protocol  = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
tauri    = { version = "2", features = ["test"] }

[package.metadata.tauri]

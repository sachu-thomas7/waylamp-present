[package]
name = "streamdeck"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
publish = false

# The lib target must explicitly point to lib.rs
[lib]
name = "streamdeck_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "streamdeck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["full"] }
sysinfo            = "0.39"
thiserror          = "2"
ts-rs              = { version = "12", features = ["serde-compat"] }
anyhow             = "1"
toml               = "0.8"
notify             = "6"
keyring            = "3"
zip             = { version = "9", default-features = false, features = ["deflate"] }
quick-xml       = { version = "0.42", features = ["serialize"] }
pdfium-render   = { version = "0.8", features = ["sync"] }
uuid            = { version = "1", features = ["v4"] }
gstreamer       = { version = "0.25", optional = true }
gstreamer-app   = { version = "0.25", optional = true }
png             = "0.17"
# pdfium-render enables image without a PNG encoder; PDF page backgrounds are saved as PNG.
image           = { version = "0.25", default-features = false, features = ["png"] }
base64          = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
qrcode = { version = "0.14", default-features = false }

# keyring 3 has no default store (it falls back to a non-persistent mock), so each OS enables its native one.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[features]
default          = ["custom-protocol"]
custom-protocol  = ["tauri/custom-protocol"]
gstreamer        = ["dep:gstreamer", "dep:gstreamer-app"]
ndi              = ["gstreamer"]
whip             = ["gstreamer"]

[dev-dependencies]
tempfile = "3"
tauri    = { version = "2", features = ["test"] }

[package.metadata.tauri]

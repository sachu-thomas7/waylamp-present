# cargo-deny config — run via `cargo deny check` or the EmbarkStudios/cargo-deny-action in CI.
# Regenerate the license/bans baseline with `cargo deny check` after adding a dependency;
# only widen the `licenses.allow` / `bans.skip` lists deliberately, not to silence a failure.

[graph]
all-features = false
no-default-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# unmaintained/unsound are checked for transitive crates too ("all"), not only workspace members.
# Every entry below was confirmed present by `cargo deny check`; delete an entry when it stops matching.
ignore = [
  # Linux-only: gtk-rs 0.18 (gtk/atk/glib) is pulled in by tauri's menu crate (muda). We never call glib directly
  # and the Windows build does not compile it. The fix needs Tauri to move to a newer gtk-rs; re-check at each Tauri bump.
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18.5 VariantStrIter unsoundness; Linux-only via muda/gtk, not used directly; blocked on Tauri" },
  # proc-macro-error — unmaintained, transitive via Tauri's Linux GTK menu bindings (muda -> glib-macros). Linux-only.
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri's Linux GTK menu bindings (muda/glib-macros); no upstream fix yet" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
]

[licenses.private]
# streamdeck itself is a private commercial app (publish = false in Cargo.toml) —
# it has no license of its own to check, only its dependencies do.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

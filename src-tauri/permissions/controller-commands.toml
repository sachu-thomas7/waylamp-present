# Every app command the controller window may invoke. The projector (presentation) gets none of these.
# Keep in step with the handler list in src/state.rs (tests/invariants.rs fails on any difference).
[[set]]
identifier = "controller-commands"
description = "All app commands, for the controller window only"
permissions = [
  "allow-get-build-info",
  "allow-ping",
  "allow-get-config",
  "allow-get-startup-notices",
  "allow-slide-advance",
  "allow-slide-rewind",
  "allow-slide-jump-to",
  "allow-slide-get-current",
  "allow-slide-timer-reset",
  "allow-deck-get-all-slides",
  "allow-deck-import",
  "allow-deck-import-stage",
  "allow-deck-import-commit",
  "allow-deck-import-discard",
  "allow-deck-restore",
  "allow-deck-clear",
  "allow-scene-push-image",
  "allow-scene-push-video",
  "allow-scene-set-source",
  "allow-scene-get-active-source",
  "allow-presentation-show",
  "allow-presentation-hide",
  "allow-display-list",
  "allow-display-assign-presentation",
  "allow-pipeline-start-test",
  "allow-pipeline-pause",
  "allow-pipeline-resume",
  "allow-pipeline-stop",
  "allow-pipeline-get-state",
  "allow-compositor-list-scenes",
  "allow-compositor-start",
  "allow-compositor-stop",
  "allow-compositor-set-layout",
  "allow-compositor-get-state",
  "allow-ndi-list-sources",
  "allow-ndi-add-source",
  "allow-ndi-remove-source",
  "allow-preview-get-snapshot",
  "allow-preview-get-layout",
  "allow-preview-set-layout",
  "allow-whip-get-info",
  "allow-whip-set-enabled",
  "allow-whip-set-token",
  "allow-whip-get-token",
  "allow-whip-get-qr",
]

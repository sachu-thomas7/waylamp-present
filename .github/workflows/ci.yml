name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref instead of letting an outdated push's jobs finish
# alongside the new one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust checks ────────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is out of scope until an Apple Developer account exists; Dependabot PRs run Ubuntu only.
        os: ${{ fromJSON(github.event.pull_request.user.login == 'dependabot[bot]' && '["ubuntu-24.04"]' || '["ubuntu-24.04","windows-2022"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep `toolchain` equal to rust-toolchain.toml (Dependabot ignores this action); matching it here avoids installing (and caching)
      # two separate toolchains in the same job.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      # Ubuntu system deps for Tauri
      - name: Install system deps (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            controller/package-lock.json
            presentation/package-lock.json

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest

      # Same command as the pre-push hook: builds both dist/ dirs (embedded at compile time), then
      # fmt, clippy -D warnings and one nextest run (incl. tests/invariants.rs).
      - name: verify push (Rust lane)
        shell: bash
        run: bash scripts/verify.sh push --only rust

  # ── Rust dependency security / license / bans ───────────────────────────────
  cargo-deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: --locked

  # ── OSV: Cargo.lock + both npm lockfiles (reviewed exceptions live in osv-scanner.toml) ──
  osv:
    name: osv-scanner (all lockfiles)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/verify.sh deps --only osv

  # ── Frontend type-checks, lint, unit tests ──────────────────────────────────
  frontend:
    name: Frontend (typecheck + lint + test)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            controller/package-lock.json
            presentation/package-lock.json

      # Same command as the pre-push hook: typecheck + Biome + Vitest (no skipped tests) for both windows.
      - name: verify push (frontend lane)
        run: bash scripts/verify.sh push --only frontend

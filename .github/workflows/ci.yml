name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "dev-docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "dev-docs/**"

# Private repo — Actions minutes are metered (macOS runs count 10x, Windows 2x against
# the monthly quota). Cancel superseded runs on the same ref instead of letting an
# outdated push's jobs finish alongside the new one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust checks ────────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]

    steps:
      - uses: actions/checkout@v6

      # Pinned by rust-toolchain.toml; matching it here avoids installing (and caching)
      # two separate toolchains in the same job.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Ubuntu system deps for Tauri
      - name: Install system deps (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            controller/package-lock.json
            presentation/package-lock.json

      # cargo test/build/clippy compile with the default "custom-protocol" feature,
      # which embeds each window's dist/ at compile time — it must exist before cargo runs.
      - name: Build frontend dist (controller + presentation)
        run: |
          npm ci --prefix controller
          npm ci --prefix presentation
          npm run build --prefix controller
          npm run build --prefix presentation

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ── Rust dependency security / license / bans ───────────────────────────────
  cargo-deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml

  # ── Frontend type-checks, lint, unit tests ──────────────────────────────────
  frontend:
    name: Frontend (typecheck + lint + test)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            controller/package-lock.json
            presentation/package-lock.json

      - name: Install controller deps
        run: npm ci --prefix controller

      - name: Install presentation deps
        run: npm ci --prefix presentation

      - name: Typecheck controller
        run: npm run typecheck --prefix controller

      - name: Typecheck presentation
        run: npm run typecheck --prefix presentation

      - name: Lint controller (Biome)
        run: npm run lint --prefix controller

      - name: Lint presentation (Biome)
        run: npm run lint --prefix presentation

      - name: Unit tests controller (Vitest)
        run: npm test --prefix controller

      - name: Unit tests presentation (Vitest)
        run: npm test --prefix presentation

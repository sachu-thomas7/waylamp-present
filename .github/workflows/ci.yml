name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "dev-docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "dev-docs/**"

# Private repo — Actions minutes are metered (macOS runs count 10x, Windows 2x against
# the monthly quota). Cancel superseded runs on the same ref instead of letting an
# outdated push's jobs finish alongside the new one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust checks ────────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is out of scope until an Apple Developer account exists; Dependabot PRs run Ubuntu only.
        os: ${{ fromJSON(github.event.pull_request.user.login == 'dependabot[bot]' && '["ubuntu-24.04"]' || '["ubuntu-24.04","windows-2022"]') }}

    steps:
      - uses: actions/checkout@v7

      # Pinned by rust-toolchain.toml; matching it here avoids installing (and caching)
      # two separate toolchains in the same job.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Ubuntu system deps for Tauri
      - name: Install system deps (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            controller/package-lock.json
            presentation/package-lock.json

      # cargo test/build/clippy compile with the default "custom-protocol" feature,
      # which embeds each window's dist/ at compile time — it must exist before cargo runs.
      - name: Build frontend dist (controller + presentation)
        run: |
          npm ci --prefix controller
          npm ci --prefix presentation
          npm run build --prefix controller
          npm run build --prefix presentation

      - name: cargo fmt
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Each test runs in its own process, so process-global state (e.g. the PRESENTING flag) cannot leak between tests.
      - name: cargo nextest
        run: cargo nextest run --locked --no-fail-fast --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ── Rust dependency security / license / bans ───────────────────────────────
  cargo-deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: --locked

  # ── OSV: Cargo.lock + both npm lockfiles (reviewed exceptions live in osv-scanner.toml) ──
  osv:
    name: osv-scanner (all lockfiles)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/osv-scan.sh

  # ── Frontend type-checks, lint, unit tests ──────────────────────────────────
  frontend:
    name: Frontend (typecheck + lint + test)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            controller/package-lock.json
            presentation/package-lock.json

      - name: Install controller deps
        run: npm ci --prefix controller

      - name: Install presentation deps
        run: npm ci --prefix presentation

      - name: Typecheck controller
        run: npm run typecheck --prefix controller

      - name: Typecheck presentation
        run: npm run typecheck --prefix presentation

      - name: Lint controller (Biome)
        run: npm run lint --prefix controller

      - name: Lint presentation (Biome)
        run: npm run lint --prefix presentation

      - name: Unit tests controller (Vitest)
        run: npm test --prefix controller

      - name: Unit tests presentation (Vitest)
        run: npm test --prefix presentation

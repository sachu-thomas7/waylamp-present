name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "dev-docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "dev-docs/**"

# Private repo — Actions minutes are metered (macOS runs count 10x, Windows 2x against
# the monthly quota). Cancel superseded runs on the same ref instead of letting an
# outdated push's jobs finish alongside the new one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust checks ────────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is out of scope until an Apple Developer account exists; Dependabot PRs run Ubuntu only.
        os: ${{ fromJSON(github.event.pull_request.user.login == 'dependabot[bot]' && '["ubuntu-24.04"]' || '["ubuntu-24.04","windows-2022"]') }}

    steps:
      - uses: actions/checkout@v7

      # Pinned by rust-toolchain.toml; matching it here avoids installing (and caching)
      # two separate toolchains in the same job.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Ubuntu system deps for Tauri
      - name: Install system deps (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            controller/package-lock.json
            presentation/package-lock.json

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Same command as the pre-push hook: builds both dist/ dirs (embedded at compile time), then
      # fmt, clippy -D warnings and one nextest run (incl. tests/invariants.rs).
      - name: verify push (Rust lane)
        shell: bash
        run: bash scripts/verify.sh push --only rust

  # ── Rust dependency security / license / bans ───────────────────────────────
  cargo-deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: --locked

  # ── OSV: Cargo.lock + both npm lockfiles (reviewed exceptions live in osv-scanner.toml) ──
  osv:
    name: osv-scanner (all lockfiles)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/verify.sh deps --only osv

  # ── Frontend type-checks, lint, unit tests ──────────────────────────────────
  frontend:
    name: Frontend (typecheck + lint + test)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            controller/package-lock.json
            presentation/package-lock.json

      # Same command as the pre-push hook: typecheck + Biome + Vitest (no skipped tests) for both windows.
      - name: verify push (frontend lane)
        run: bash scripts/verify.sh push --only frontend

name: release

# Tag-triggered only; never runs on pull_request, so signing secrets are never exposed to PRs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write # create the draft release
    env:
      HAVE_AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read pinned toolchain
        id: tc
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.11" --locked

      # Tauri downloads NSIS itself; this makes a failure of that download visible and early.
      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Install artifact-signing-cli (only when signing is configured)
        if: ${{ env.HAVE_AZURE_SIGNING == 'true' }}
        run: cargo install artifact-signing-cli --locked

      - name: Build installer
        run: |
          if [ -z "${STREAMDECK_SIGN_COMMAND:-}" ] && [ "$HAVE_AZURE_SIGNING" = true ]; then
            export STREAMDECK_SIGN_COMMAND="artifact-signing-cli -e $AZURE_SIGN_ENDPOINT -a $AZURE_SIGN_ACCOUNT -c $AZURE_SIGN_PROFILE -d StreamDeck %1"
          fi
          bash scripts/build-release.sh
        env:
          # Signing is skipped when these are absent. Secrets live in GitHub secrets only.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          STREAMDECK_SIGN_COMMAND: ${{ secrets.STREAMDECK_SIGN_COMMAND }}

      - name: Silent install, launch smoke, uninstall, leftover check
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'sd-install'
          $p = Start-Process $setup.FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $exe = Join-Path $dir 'streamdeck.exe'
          if (-not (Test-Path $exe)) { throw 'streamdeck.exe not installed' }
          if (-not (Test-Path (Join-Path $dir 'pdfium.dll'))) { throw 'pdfium.dll not installed' }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "app exited early with $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $un = Join-Path $dir 'uninstall.exe'
          Start-Process $un -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw 'streamdeck.exe left behind after uninstall' }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            --notes "Draft. Unsigned unless the release notes say otherwise; see dev-docs/release_process.md." \
            target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/SHA256SUMS.txt

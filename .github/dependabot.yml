version: 2
# Monthly cadence, one grouped PR per ecosystem, low open-PR cap to keep review load small.
updates:
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/controller"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/presentation"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    ignore:
      # The toolchain is pinned in rust-toolchain.toml and ci.yml; bump the action SHA by hand.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns: ["*"]

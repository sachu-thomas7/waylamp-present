version: 2
# CI minutes are metered: monthly cadence, one grouped PR per ecosystem, low open-PR cap.
updates:
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/controller"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/presentation"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      actions:
        patterns: ["*"]

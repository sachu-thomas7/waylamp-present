name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Import a deck\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      description: Shown in Settings, Build Info.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, Linux, Other]
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: Display setup
      description: Number of displays, and whether the projector is mirrored or extended.
  - type: textarea
    id: file
    attributes:
      label: Sample file or logs
      description: For import problems, attach a deck that triggers it (no private content). Do not paste secrets.
